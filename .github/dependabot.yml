# Dependabot: one grouped PR a week per entry for minor and patch updates (group
# `minor-patch`, which the Fable review gate in proteanP/services-directory may merge);
# majors come as their own PRs and security updates as one grouped PR; both wait for Max.
# See services-directory StackUpdate/README.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
